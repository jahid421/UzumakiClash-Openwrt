<%+header%>
<style>
:root {
    --bg: #f5f5f5; --card: #fff; --text: #333; --accent: #6366f1;
}
[data-theme="dark"] {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --accent: #818cf8;
}
body { background: var(--bg); color: var(--text); transition: 0.3s; }
.uzu-card {
    background: var(--card); border-radius: 12px; padding: 20px;
    margin: 15px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}
.uzu-btn {
    background: var(--accent); color: white; padding: 10px 20px;
    border: none; border-radius: 8px; cursor: pointer; font-weight: 600;
}
.uzu-btn:hover { opacity: 0.9; transform: translateY(-2px); }
.status-dot {
    width: 12px; height: 12px; border-radius: 50%; display: inline-block;
}
.status-on  { background: #10b981; box-shadow: 0 0 10px #10b981; }
.status-off { background: #ef4444; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>

<div class="cbi-map">
    <h2>🍥 UzumakiClash Control Panel</h2>
    
    <div class="uzu-card">
        <h3>📊 System Status</h3>
        <div class="grid">
            <div>Service: <span id="status-dot" class="status-dot status-off"></span> <span id="status-text">Loading...</span></div>
            <div>Memory: <b id="mem-usage">- KB</b></div>
            <div>Version: <b id="version">-</b></div>
        </div>
    </div>

    <div class="uzu-card">
        <h3>⚡ Quick Actions</h3>
        <button class="uzu-btn" onclick="restartService()">🔄 Restart</button>
        <button class="uzu-btn" onclick="updateSubs()">📥 Update Subscriptions</button>
        <button class="uzu-btn" onclick="openDashboard()">🎨 Open Dashboard</button>
        <button class="uzu-btn" onclick="toggleTheme()">🌓 Toggle Theme</button>
    </div>

    <div class="uzu-card">
        <h3>📱 Dashboard Access</h3>
        <p>URL: <code id="dash-url">http://ROUTER_IP:9090/ui</code></p>
        <p>Secret: <code>uzumaki-clash-secret</code></p>
    </div>
</div>

<script>
function loadStatus() {
    fetch('<%=luci.dispatcher.build_url("admin/services/uzumaki/status")%>')
        .then(r => r.json())
        .then(d => {
            document.getElementById('status-dot').className = 
                'status-dot ' + (d.running ? 'status-on' : 'status-off');
            document.getElementById('status-text').textContent = d.running ? 'Running' : 'Stopped';
            document.getElementById('mem-usage').textContent = d.memory_kb + ' KB';
            document.getElementById('version').textContent = d.version || 'Unknown';
        });
}
function restartService() {
    if (!confirm('Restart UzumakiClash?')) return;
    fetch('<%=luci.dispatcher.build_url("admin/services/uzumaki/restart")%>')
        .then(() => setTimeout(loadStatus, 3000));
}
function updateSubs() {
    fetch('<%=luci.dispatcher.build_url("admin/services/uzumaki/update_sub")%>')
        .then(() => alert('Subscription update started!'));
}
function openDashboard() {
    window.open('http://' + location.hostname + ':9090/ui', '_blank');
}
function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('uzu-theme', next);
}
document.documentElement.setAttribute('data-theme', localStorage.getItem('uzu-theme') || 'light');
document.getElementById('dash-url').textContent = 'http://' + location.hostname + ':9090/ui';
loadStatus();
setInterval(loadStatus, 5000);
</script>

<%+footer%>
