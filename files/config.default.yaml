mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
allow-lan: true
bind-address: '*'
mode: rule
log-level: error
ipv6: false
external-controller: 0.0.0.0:9595
external-ui: /etc/mihomo/ui
secret: "flclash123"
tcp-concurrent: true
unified-delay: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
  direct-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.microsoft.com'
    - '+.xboxlive.com'
    - '+.playvalorant.com'
    - '+.riotgames.com'

proxies:
  - name: "Dummy-Socks5"
    type: socks5
    server: 127.0.0.1
    port: 1080

proxy-groups:
  - name: "🌀 Uzumaki-Auto"
    type: select
    proxies:
      - DIRECT
      - "Dummy-Socks5"

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - NETWORK,udp,DIRECT
  - DOMAIN-SUFFIX,riotgames.com,DIRECT
  - DOMAIN-SUFFIX,playvalorant.com,DIRECT
  - DOMAIN-SUFFIX,microsoft.com,DIRECT
  - DOMAIN-SUFFIX,windows.com,DIRECT
  - MATCH,🌀 Uzumaki-Auto
