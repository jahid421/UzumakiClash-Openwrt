mixed-port: 7890
redir-port: 7892
allow-lan: true
bind-address: '*'
mode: rule
log-level: error
ipv6: false
external-controller: 0.0.0.0:9595
external-ui: /etc/mihomo/ui
secret: "flclash123"
tcp-concurrent: true
unified-delay: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'time.*.com'
    - 'ntp.*.com'
    - '*.pool.ntp.org'
    # Speedtest & Benchmark Sites
    - '*.speedtest.net'
    - 'speedtest.net'
    - '*.ooklaserver.net'
    # Microsoft & MS Store Fix
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - 'msftncsi.com'
    - '*.microsoft.com'
    - 'microsoft.com'
    - '*.windowsupdate.com'
    - '*.store.microsoft.com'
    - '*.delivery.mp.microsoft.com'
    # Riot Games & Valorant Fix
    - '*.pvp.net'
    - 'pvp.net'
    - '*.riotgames.com'
    - 'riotgames.com'
    - '*.playvalorant.com'
    - 'playvalorant.com'
    - '*.leagueoflegends.com'
    - '*.rgpub.io'
    - '*.riotcdn.net'
    - '*.rnet.riotgames.com'
    - 'anticheat.riotgames.com'
    # Discord Voice
    - '*.discord.gg'
    - '*.discord.media'

  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 1.0.0.1

proxies: []

proxy-groups:
  - name: "🌀 Uzumaki-Auto"
    type: url-test
    proxies:
      - DIRECT
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 20
    lazy: true

rules:
  # Local Subnets
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'DOMAIN-SUFFIX,local,DIRECT'
  - 'DOMAIN-SUFFIX,lan,DIRECT'

  # Direct Bypasses
  - 'DOMAIN-SUFFIX,speedtest.net,DIRECT'
  - 'DOMAIN-KEYWORD,microsoft,DIRECT'
  - 'DOMAIN-KEYWORD,riotgames,DIRECT'
  - 'DOMAIN-KEYWORD,playvalorant,DIRECT'
  - 'DOMAIN-SUFFIX,pvp.net,DIRECT'
  - 'DOMAIN-SUFFIX,riotcdn.net,DIRECT'
  - 'DOMAIN-SUFFIX,rnet.riotgames.com,DIRECT'
  - 'DOMAIN-SUFFIX,discord.gg,DIRECT'

  # Uzumaki Web Control
  - 'DST-PORT,9595,DIRECT'

  # Match
  - 'MATCH,🌀 Uzumaki-Auto'
