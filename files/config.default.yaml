mixed-port: 7890
redir-port: 7892
tproxy-port: 7893

allow-lan: true
bind-address: '*'

mode: rule
log-level: error
ipv6: false

external-controller: 0.0.0.0:9595

# Allow the LuCI UI to communicate with the controller.
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true

external-ui: /etc/mihomo/ui
secret: "flclash123"

tcp-concurrent: true
unified-delay: true
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  override-destination: true

  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880

    TLS:
      ports:
        - 443
        - 8443

    QUIC:
      ports:
        - 443
        - 8443

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'localhost'

    - 'time.*.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'

    - '+.msftconnecttest.com'
    - '+.msftncsi.com'

    - '+.microsoft.com'
    - '+.microsoftonline.com'
    - '+.windows.com'
    - '+.windows.net'
    - '+.windowsupdate.com'
    - '+.live.com'

    - 'storeedgefd.dsx.mp.microsoft.com'
    - 'livetileedge.dsx.mp.microsoft.com'
    - 'displaycatalog.mp.microsoft.com'
    - 'dl.delivery.mp.microsoft.com'
    - 'delivery.mp.microsoft.com'
    - 'update.microsoft.com'

    - 'img-prod-cms-rt-microsoft-com.akamaized.net'
    - 'img-s-msn-com.akamaized.net'

    - '+.wns.windows.com'

    - '+.riotgames.com'
    - '+.riotcdn.net'
    - '+.playvalorant.com'
    - '+.pvp.net'
    - '+.leagueoflegends.com'

    - '+.epicgames.com'
    - '+.epicgamescdn.com'
    - '+.unrealengine.com'

    - '+.steampowered.com'
    - '+.steamcommunity.com'
    - '+.steamcontent.com'

    - '+.ubisoft.com'
    - '+.ubi.com'

    - '+.ea.com'
    - '+.origin.com'

    - '+.ultraviewer.net'
    - '+.ultraviewer.com'

proxies: []

proxy-groups:
  - name: "🌀 Uzumaki-Auto"
    type: url-test
    proxies:
      - DIRECT
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 30
    lazy: true

rules:
  # Router / LAN / reserved networks
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,169.254.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,224.0.0.0/4,DIRECT,no-resolve'
  - 'IP-CIDR,240.0.0.0/4,DIRECT,no-resolve'

  - 'DOMAIN-SUFFIX,local,DIRECT'
  - 'DOMAIN-SUFFIX,lan,DIRECT'

  # Uzumaki controller
  - 'DST-PORT,9595,DIRECT'

  # Do NOT force arbitrary UDP through an HTTP-only outbound.
  # UDP-capable nodes can be handled by the user's own YAML/rules.
  - 'NETWORK,UDP,DIRECT'

  # Everything else follows the selected proxy group.
  - 'MATCH,🌀 Uzumaki-Auto'
