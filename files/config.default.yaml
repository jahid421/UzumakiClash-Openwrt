mixed-port: 7890
redir-port: 7892
tproxy-port: 7893

allow-lan: true
bind-address: '*'

mode: rule
log-level: warning
ipv6: false

external-controller: 0.0.0.0:9595
external-ui: /etc/mihomo/ui
secret: "flclash123"

tcp-concurrent: true
unified-delay: false
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

# ==========================================================
# SNIFFER
# ==========================================================
sniffer:
  enable: true
  override-destination: true

  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880

    TLS:
      ports:
        - 443
        - 8443

    QUIC:
      ports:
        - 443
        - 8443

# ==========================================================
# DNS
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  fake-ip-filter:

    - '*.lan'
    - '*.local'
    - 'localhost'

    - 'time.*.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'

    # Microsoft connectivity
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'

    # Microsoft / Windows
    - '+.microsoft.com'
    - '+.microsoftonline.com'
    - '+.windows.com'
    - '+.windows.net'
    - '+.windowsupdate.com'
    - '+.live.com'

    # Microsoft Store endpoints
    - 'storeedgefd.dsx.mp.microsoft.com'
    - 'livetileedge.dsx.mp.microsoft.com'
    - 'displaycatalog.mp.microsoft.com'
    - 'dl.delivery.mp.microsoft.com'
    - 'delivery.mp.microsoft.com'
    - 'update.microsoft.com'

    - 'img-prod-cms-rt-microsoft-com.akamaized.net'
    - 'img-s-msn-com.akamaized.net'

    - '+.wns.windows.com'

    # Riot / Valorant
    - '+.riotgames.com'
    - '+.riotcdn.net'
    - '+.playvalorant.com'
    - '+.pvp.net'
    - '+.leagueoflegends.com'

    # Remote desktop
    - '+.ultraviewer.net'
    - '+.ultraviewer.com'
    - '+.anydesk.com'
    - '+.teamviewer.com'
    - '+.rustdesk.com'
    - '+.parsec.app'

  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 1.0.0.1

# ==========================================================
# PROXIES
# ==========================================================
proxies: []

# ==========================================================
# DEFAULT PROXY GROUP
# ==========================================================
proxy-groups:

  - name: "🌀 Uzumaki-Auto"
    type: url-test

    proxies:
      - DIRECT

    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 30
    lazy: true

# ==========================================================
# RULES
# ==========================================================
rules:

  # --------------------------------------------------------
  # LOCAL
  # --------------------------------------------------------
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,169.254.0.0/16,DIRECT,no-resolve'

  - 'DOMAIN-SUFFIX,local,DIRECT'
  - 'DOMAIN-SUFFIX,lan,DIRECT'

  # --------------------------------------------------------
  # MICROSOFT / WINDOWS
  # --------------------------------------------------------
  - 'DOMAIN-SUFFIX,microsoft.com,DIRECT'
  - 'DOMAIN-SUFFIX,microsoftonline.com,DIRECT'
  - 'DOMAIN-SUFFIX,windows.com,DIRECT'
  - 'DOMAIN-SUFFIX,windows.net,DIRECT'
  - 'DOMAIN-SUFFIX,windowsupdate.com,DIRECT'
  - 'DOMAIN-SUFFIX,live.com,DIRECT'

  - 'DOMAIN-SUFFIX,msftconnecttest.com,DIRECT'
  - 'DOMAIN-SUFFIX,msftncsi.com,DIRECT'

  - 'DOMAIN-SUFFIX,storeedgefd.dsx.mp.microsoft.com,DIRECT'
  - 'DOMAIN-SUFFIX,livetileedge.dsx.mp.microsoft.com,DIRECT'
  - 'DOMAIN-SUFFIX,displaycatalog.mp.microsoft.com,DIRECT'
  - 'DOMAIN-SUFFIX,dl.delivery.mp.microsoft.com,DIRECT'
  - 'DOMAIN-SUFFIX,delivery.mp.microsoft.com,DIRECT'
  - 'DOMAIN-SUFFIX,update.microsoft.com,DIRECT'

  - 'DOMAIN-SUFFIX,img-prod-cms-rt-microsoft-com.akamaized.net,DIRECT'
  - 'DOMAIN-SUFFIX,img-s-msn-com.akamaized.net,DIRECT'

  - 'DOMAIN-SUFFIX,wns.windows.com,DIRECT'

  # --------------------------------------------------------
  # ULTRAVIEWER / REMOTE DESKTOP
  # --------------------------------------------------------
  - 'DOMAIN-SUFFIX,ultraviewer.net,DIRECT'
  - 'DOMAIN-SUFFIX,ultraviewer.com,DIRECT'
  - 'DOMAIN-SUFFIX,anydesk.com,DIRECT'
  - 'DOMAIN-SUFFIX,teamviewer.com,DIRECT'
  - 'DOMAIN-SUFFIX,rustdesk.com,DIRECT'
  - 'DOMAIN-SUFFIX,parsec.app,DIRECT'

  - 'DST-PORT,2112,DIRECT'

  # --------------------------------------------------------
  # RIOT / VALORANT
  # --------------------------------------------------------
  - 'DOMAIN-SUFFIX,riotgames.com,DIRECT'
  - 'DOMAIN-SUFFIX,riotcdn.net,DIRECT'
  - 'DOMAIN-SUFFIX,playvalorant.com,DIRECT'
  - 'DOMAIN-SUFFIX,pvp.net,DIRECT'
  - 'DOMAIN-SUFFIX,leagueoflegends.com,DIRECT'

  # Riot / League service ports
  - 'DST-PORT,2099,DIRECT'
  - 'DST-PORT,5222,DIRECT'
  - 'DST-PORT,5223,DIRECT'
  - 'DST-PORT,8088,DIRECT'
  - 'DST-PORT,8393-8400,DIRECT'

  # --------------------------------------------------------
  # BANGLADESH
  # --------------------------------------------------------
  - 'DOMAIN-SUFFIX,bd,DIRECT'

  # --------------------------------------------------------
  # DEFAULT
  # --------------------------------------------------------
  - 'MATCH,🌀 Uzumaki-Auto'
