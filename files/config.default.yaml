mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
allow-lan: true
bind-address: '*'
mode: rule
log-level: error
ipv6: false
external-controller: 0.0.0.0:9595
external-ui: /etc/mihomo/ui
secret: "flclash123"
tcp-concurrent: true
unified-delay: true

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 1.0.0.1
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'
    - '+.speedtest.net'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'msftncsi.com'
    - '+.microsoft.com'
    - '+.windowsupdate.com'
    - '+.riotgames.com'
    - '+.playvalorant.com'
    - '+.leagueoflegends.com'
    - '+.pvp.net'

proxies: []

proxy-groups:
  - name: "🌀 Uzumaki-Auto"
    type: url-test
    proxies:
      - DIRECT
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 20
    lazy: true

rules:
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'DOMAIN-SUFFIX,local,DIRECT'
  - 'DOMAIN-SUFFIX,lan,DIRECT'
  # Riot & Games Bypass (OOM Safe)
  - 'DOMAIN-SUFFIX,riotgames.com,DIRECT'
  - 'DOMAIN-SUFFIX,playvalorant.com,DIRECT'
  - 'DOMAIN-SUFFIX,pvp.net,DIRECT'
  - 'DOMAIN-SUFFIX,leagueoflegends.com,DIRECT'
  - 'DOMAIN-KEYWORD,valorant,DIRECT'
  - 'DOMAIN-KEYWORD,riot,DIRECT'
  # Microsoft & Windows Store Bypass
  - 'DOMAIN-SUFFIX,microsoft.com,DIRECT'
  - 'DOMAIN-SUFFIX,windowsupdate.com,DIRECT'
  - 'DOMAIN-SUFFIX,msftconnecttest.com,DIRECT'
  - 'DOMAIN-SUFFIX,xboxlive.com,DIRECT'
  - 'MATCH,🌀 Uzumaki-Auto'
