mixed-port: 7890
redir-port: 7892
allow-lan: true
bind-address: '*'
mode: rule
log-level: error
ipv6: false
external-controller: 0.0.0.0:9595
external-ui: /etc/mihomo/ui
secret: "flclash123"
tcp-concurrent: true
unified-delay: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    # GEOSITE Auto Rules (Fixes Riot, Valorant, MS Store & Games)
    - 'geosite:riot'
    - 'geosite:microsoft'
    - 'geosite:category-games'
    - '*.lan'
    - '*.local'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'
    - '+.speedtest.net'
    - '+.ooklaserver.net'
    - '+.ovh.net'
    - '+.fast.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'msftncsi.com'
    - '+.microsoft.com'
    - '+.windowsupdate.com'
    - '+.store.microsoft.com'
    - '+.xboxlive.com'
    - '+.pvp.net'
    - '+.riotgames.com'
    - '+.playvalorant.com'
    - '+.leagueoflegends.com'
    - '+.rgpub.io'
    - '+.riotcdn.net'
    - '+.rnet.riotgames.com'
    - 'anticheat.riotgames.com'

  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 1.0.0.1

proxies: []

proxy-groups:
  - name: "🌀 Uzumaki-Auto"
    type: url-test
    proxies:
      - DIRECT
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 20
    lazy: true

rules:
  # Local Subnets
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'DOMAIN-SUFFIX,local,DIRECT'
  - 'DOMAIN-SUFFIX,lan,DIRECT'

  # GEOSITE Direct Rules (Riot Games, Microsoft, Games)
  - 'GEOSITE,riot,DIRECT'
  - 'GEOSITE,microsoft,DIRECT'

  # Direct Domain Fallbacks
  - 'DOMAIN-SUFFIX,speedtest.net,DIRECT'
  - 'DOMAIN-SUFFIX,pvp.net,DIRECT'
  - 'DOMAIN-SUFFIX,riotgames.com,DIRECT'
  - 'DOMAIN-SUFFIX,playvalorant.com,DIRECT'
  - 'DOMAIN-KEYWORD,valorant,DIRECT'
  - 'DOMAIN-KEYWORD,riot,DIRECT'

  # Uzumaki Control
  - 'DST-PORT,9595,DIRECT'

  # Match
  - 'MATCH,🌀 Uzumaki-Auto'
