```yaml
mixed-port: 7890
redir-port: 7892
tproxy-port: 7893

allow-lan: true
bind-address: '*'

mode: rule
log-level: error
ipv6: false

external-controller: 0.0.0.0:9595
external-ui: /etc/mihomo/ui
secret: "flclash123"

tcp-concurrent: true
unified-delay: false
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false

  enhanced-mode: redir-host

  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 1.0.0.1

  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'localhost'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.microsoft.com'
    - '+.microsoftonline.com'
    - '+.windows.com'
    - '+.windows.net'
    - '+.windowsupdate.com'
    - '+.live.com'
    - '+.riotgames.com'
    - '+.riotcdn.net'
    - '+.playvalorant.com'
    - '+.pvp.net'
    - '+.leagueoflegends.com'
    - '+.ultraviewer.net'
    - '+.ultraviewer.com'

proxies: []

proxy-groups:
  - name: "🌀 Uzumaki-Auto"
    type: url-test
    proxies:
      - DIRECT
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 50
    lazy: true

rules:
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,169.254.0.0/16,DIRECT,no-resolve'
  - 'DOMAIN-SUFFIX,local,DIRECT'
  - 'DOMAIN-SUFFIX,lan,DIRECT'

  # Microsoft / Windows connectivity
  - 'DOMAIN-SUFFIX,microsoft.com,DIRECT'
  - 'DOMAIN-SUFFIX,microsoftonline.com,DIRECT'
  - 'DOMAIN-SUFFIX,windows.com,DIRECT'
  - 'DOMAIN-SUFFIX,windows.net,DIRECT'
  - 'DOMAIN-SUFFIX,windowsupdate.com,DIRECT'
  - 'DOMAIN-SUFFIX,msftconnecttest.com,DIRECT'
  - 'DOMAIN-SUFFIX,msftncsi.com,DIRECT'

  # Riot / Valorant
  - 'DOMAIN-SUFFIX,riotgames.com,DIRECT'
  - 'DOMAIN-SUFFIX,riotcdn.net,DIRECT'
  - 'DOMAIN-SUFFIX,playvalorant.com,DIRECT'
  - 'DOMAIN-SUFFIX,pvp.net,DIRECT'
  - 'DOMAIN-SUFFIX,leagueoflegends.com,DIRECT'

  # UltraViewer
  - 'DOMAIN-SUFFIX,ultraviewer.net,DIRECT'
  - 'DOMAIN-SUFFIX,ultraviewer.com,DIRECT'

  # Local Bangladesh services
  - 'DOMAIN-SUFFIX,bd,DIRECT'

  # API / controller
  - 'DST-PORT,9595,DIRECT'

  # Everything else
  - 'MATCH,🌀 Uzumaki-Auto'
```
