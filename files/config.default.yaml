mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
allow-lan: true
bind-address: '*'
mode: rule
log-level: error
ipv6: false
external-controller: 0.0.0.0:9595
external-ui: /etc/mihomo/ui
secret: "flclash123"
tcp-concurrent: true
unified-delay: true
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  # ⚡ Optimized DNS for Raw Speed
  use-hosts: true
  use-system-hosts: true
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.home'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'connectivitycheck.gstatic.com'
    - 'connectivitycheck.android.com'
    - 'captive.apple.com'
    - 'clients3.google.com'
    - '+.gstatic.com'
    - 'tplinkwifi.net'
    - 'tendawifi.com'
    - 'router.asus.com'
    - 'miwifi.com'
    - 'netis.cc'
    - 'time.*.com'
    - 'ntp.*.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
  direct-nameserver:
    - 1.1.1.1
    - 8.8.8.8
