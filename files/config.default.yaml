mixed-port: 7890
redir-port: 7892
allow-lan: true
bind-address: '*'
mode: rule
log-level: error
ipv6: false
external-controller: 0.0.0.0:9595
external-ui: /etc/mihomo/ui
secret: "flclash123"
tcp-concurrent: true
unified-delay: true

sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080]

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 1.0.0.1
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.pool.ntp.org'
    - 'time.apple.com'
    - 'time.windows.com'
    - 'time.nist.gov'
    - '+.speedtest.net'
    - '+.ooklaserver.net'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.microsoft.com'
    - '+.windowsupdate.com'
    - '+.store.microsoft.com'
    - '+.pvp.net'
    - '+.riotgames.com'
    - '+.playvalorant.com'
    - '+.leagueoflegends.com'
    - '+.rgpub.io'
    - '+.riotcdn.net'
    - '+.rnet.riotgames.com'
    - 'anticheat.riotgames.com'
    - '+.discord.gg'
    - '+.discord.media'

proxies: []

proxy-groups:
  - name: "🌀 Uzumaki-Auto"
    type: url-test
    proxies:
      - DIRECT
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 20
    lazy: true

rules:
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'DOMAIN-SUFFIX,local,DIRECT'
  - 'DOMAIN-SUFFIX,lan,DIRECT'
  - 'IP-CIDR,162.249.72.0/22,DIRECT,no-resolve'
  - 'IP-CIDR,192.64.168.0/22,DIRECT,no-resolve'
  - 'IP-CIDR,172.65.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,103.240.224.0/22,DIRECT,no-resolve'
  - 'IP-CIDR,103.2.196.0/22,DIRECT,no-resolve'
  - 'IP-CIDR,151.106.0.0/16,DIRECT,no-resolve'
  - 'DOMAIN-SUFFIX,speedtest.net,DIRECT'
  - 'DOMAIN-KEYWORD,microsoft,DIRECT'
  - 'DOMAIN-KEYWORD,riotgames,DIRECT'
  - 'DOMAIN-KEYWORD,playvalorant,DIRECT'
  - 'DOMAIN-SUFFIX,pvp.net,DIRECT'
  - 'DOMAIN-SUFFIX,riotcdn.net,DIRECT'
  - 'DOMAIN-SUFFIX,rnet.riotgames.com,DIRECT'
  - 'DOMAIN-SUFFIX,discord.gg,DIRECT'
  - 'DST-PORT,9595,DIRECT'
  - 'MATCH,🌀 Uzumaki-Auto'
