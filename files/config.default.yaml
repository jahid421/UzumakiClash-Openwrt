mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
allow-lan: true
bind-address: '*'
mode: rule
log-level: error
ipv6: false
external-controller: 0.0.0.0:9595
external-ui: /etc/mihomo/ui
secret: "flclash123"
tcp-concurrent: true
unified-delay: true
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.home'
    - '*.arpa'
    # 🎮 Riot & Valorant (Anti-Cheat Bypass)
    - '+.playvalorant.com'
    - '+.riotgames.com'
    - '+.riotcdn.net'
    - '+.pvp.net'
    - '+.leagueoflegends.com'
    # 🎮 Xbox & Microsoft Games
    - '+.microsoft.com'
    - '+.xboxlive.com'
    - '+.windowsupdate.com'
    # Secondary Router Connectivity Checks
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'connectivitycheck.gstatic.com'
    - 'connectivitycheck.android.com'
    - 'captive.apple.com'
    - '+.apple.com'
    - 'clients3.google.com'
    - 'clients.l.google.com'
    - '+.gstatic.com'
    - 'detectportal.firefox.com'
    - 'nmcheck.gnome.org'
    - 'network-test.debian.org'
    - 'tplinkwifi.net'
    - 'tplinklogin.net'
    - 'tendawifi.com'
    - 'tendawifi.net'
    - 'router.asus.com'
    - 'miwifi.com'
    - 'mediarouter.home'
    - 'routerlogin.net'
    - 'routerlogin.com'
    - 'netis.cc'
    - 'time.*.com'
    - 'time.*.gov'
    - 'ntp.*.com'
    - '+.pool.ntp.org'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
  direct-nameserver:
    - 1.1.1.1
    - 8.8.8.8

proxies:
  - name: "Dummy-Socks5"
    type: socks5
    server: 127.0.0.1
    port: 1080

proxy-groups:
  - name: "🌀 Uzumaki-Auto"
    type: select
    proxies:
      - DIRECT
      - "Dummy-Socks5"

rules:
  - 'MATCH,🌀 Uzumaki-Auto'
